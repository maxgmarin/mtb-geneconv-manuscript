cluster-cancel: "scancel"
restart-times: "0"
jobscript: "slurm-jobscript.sh"
cluster: "slurm-submit.py"
cluster-status: "slurm-status.py"
max-jobs-per-second: "10"
max-status-checks-per-second: "10"
local-cores: 1
latency-wait: "45"
use-conda: "False"
use-singularity: "False"
jobs: "500"
printshellcmds: "True"

cluster:
  mkdir -p {params.slurm_log_dir}/logs/{rule}/ && 
  sbatch -p {params.partition} --cpus-per-task={threads} 
    --mem={resources.mem_mb}
    --time={resources.runtime_slurm}
    --job-name=smk-{rule}
    --parsable
    --output={params.slurm_log_dir}/logs/{rule}/{jobid}.{wildcards}.out
    --error={params.slurm_log_dir}/logs/{rule}/{jobid}.{wildcards}.err

# --cpus-per-task={threads} # --mem={resources.mem_mb}
# --cpus-per-task=1 

# Example resource configuration
default-resources:
   - runtime=30
   - mem_mb=2000
   - disk_mb=1000000

resource_aggregation:
  threads: max
  mem_mb: max
  runtime_slurm: max


